[project]
name = "image-editor"
version = "0.1.0"
description = "多轮修图 Agent 框架 — 基于豆包大模型 + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<1.0",
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.25,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.20,<1.0",
    "pydantic>=2.0,<3.0",
    "Pillow>=10.0,<12.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9,<3.0",
    "dramatiq[redis]>=1.17,<2.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
# 本地模型支持（按需安装）
local-lama = [
    "simple-lama-inpainting>=0.1",
]
local-moebius = [
    "torch>=2.0",
    "diffusers>=0.30",
    "transformers>=4.0",
    "accelerate>=0.25",
    "safetensors>=0.4",
    "omegaconf>=2.2",
    "opencv-python>=4.0",
    "timm>=1.0",
    "toml>=0.10",
    "orjson>=3.0",
    "pandas>=2.0",
    "scipy>=1.0",
    "lpips>=0.1",
    "tensorboard>=2.0",
    "flash-linear-attention[cuda]>=0.3.2",
]
local-all = [
    "image-editor[local-lama,local-moebius]",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["image_editor*"]
